<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PALPAL Debug</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="layout">
      <aside class="navigationPane">
        <section>
          <h2>Exploration</h2>
          <div id="exploration" class="exploration"></div>
        </section>
        <section>
          <h2>Navigation</h2>
          <div id="navigation" class="navigation"></div>
        </section>
      </aside>
      <section class="screenPane">
        <div class="toolbar">
          <strong>PALPAL Debug</strong>
          <span id="connection">connecting</span>
        </div>
        <div id="runtimeStatus" class="runtimeStatus" hidden></div>
        <div class="screenWrap">
          <canvas id="frame" width="320" height="200" aria-label="latest game frame"></canvas>
          <canvas id="overlay" width="640" height="400"></canvas>
          <div id="summary" class="summary stateOverlay" aria-label="game state summary"></div>
          <div id="logicalRoom" class="logicalRoomOverlay" aria-label="logical room"></div>
        </div>
        <div class="controls" aria-label="game controls">
          <section class="controlGroup moveGroup" aria-label="movement">
            <h2>Move</h2>
            <div class="dpad">
              <span></span>
              <button data-button="up" aria-label="Up">Up</button>
              <span></span>
              <button data-button="left" aria-label="Left">Left</button>
              <span></span>
              <button data-button="right" aria-label="Right">Right</button>
              <span></span>
              <button data-button="down" aria-label="Down">Down</button>
              <span></span>
            </div>
          </section>
          <section class="controlGroup actionGroup" aria-label="primary actions">
            <h2>Actions</h2>
            <div class="actionButtons">
              <button class="primaryAction" data-button="search">Search / Confirm</button>
              <button id="fastDialog" class="dialogAdvanceButton" type="button" disabled>Fast Dialog</button>
              <button data-button="menu">Menu / Cancel</button>
              <button data-button="status">Status</button>
              <button id="transitionsButton" type="button">Transitions</button>
            </div>
          </section>
          <details class="controlGroup advancedGroup">
            <summary>Advanced / Battle</summary>
            <div class="advancedButtons">
              <button data-button="page_up">Page Up</button>
              <button data-button="page_down">Page Down</button>
              <button data-button="repeat">Repeat</button>
              <button data-button="auto">Auto</button>
              <button data-button="defend">Defend</button>
              <button data-button="use_item">Use Item</button>
              <button data-button="throw_item">Throw Item</button>
              <button data-button="flee">Flee</button>
              <button data-button="force">Force</button>
              <button data-button="home">Home</button>
              <button data-button="end">End</button>
            </div>
          </details>
        </div>
      </section>
      <aside class="statePane">
        <section>
          <div id="checkpoints" class="checkpoints"></div>
        </section>
        <section>
          <div class="sectionHeader">
            <h2>Agent</h2>
            <span class="agentMode">manual execute</span>
          </div>
          <div id="agent" class="agent"></div>
        </section>
        <section>
          <h2>Dialog History</h2>
          <div id="dialogs" class="dialogs"></div>
        </section>
        <section>
          <h2>Events</h2>
          <div id="events" class="events"></div>
        </section>
        <section>
          <h2>Inventory</h2>
          <div id="inventory" class="inventory"></div>
        </section>
        <section>
          <h2>Equipment</h2>
          <div id="equipment" class="equipment"></div>
        </section>
        <section>
          <details class="objectsDetails">
            <summary>Objects</summary>
            <div id="objects" class="objects"></div>
          </details>
        </section>
        <section class="jsonSection">
          <details id="jsonDetails">
            <summary>
              <span class="jsonTitle">JSON</span>
              <span id="jsonStatus"></span>
            </summary>
            <div class="jsonControls">
              <label><input id="jsonLive" type="checkbox" /> live</label>
              <button id="jsonRefresh" type="button">Refresh</button>
            </div>
            <pre id="json"></pre>
          </details>
        </section>
      </aside>
    </main>
    <dialog id="transitionsDialog" class="transitionsDialog" aria-labelledby="transitionsTitle">
      <div class="transitionsDialogHeader">
        <div>
          <h2 id="transitionsTitle">Known Transitions</h2>
          <div id="transitionsRoom" class="transitionsRoom"></div>
        </div>
        <button id="transitionsClose" class="transitionsClose" type="button" aria-label="Close transitions">Close</button>
      </div>
      <div id="transitionsContent" class="transitionsContent" aria-live="polite"></div>
    </dialog>
    <script src="/app.js"></script>
  </body>
</html>
