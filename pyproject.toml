[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "palpal"
version = "0.1.0"
description = "Local PAL game debug server and agent bridge."
requires-python = ">=3.9"

[project.optional-dependencies]
dev = [
    "coverage[toml]>=7.5",
    "pytest>=8.2",
    "pytest-cov>=5.0",
]

[tool.setuptools]
packages = ["palpal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.coverage.run]
source = ["palpal", "scripts"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
